name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and env
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK with friendly filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SmartPageLibrary-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPageLibrary-debug-apk
          path: dist/SmartPageLibrary-debug.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build (Smart Page Library)' }}
          files: dist/SmartPageLibrary-debug.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
